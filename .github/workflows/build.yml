name: Build and Release Tabaay Student

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: سحب الكود من المستودع
      uses: actions/checkout@v4

    - name: إعداد بيئة بايثون
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: تثبيت المكتبات المطلوبة
      run: |
        python -m pip install --upgrade pip
        pip install eel requests pyinstaller pyarmor

    - name: إعداد أدوات تشويش الواجهة (Node.js)
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: تشفير الكود وتحويل البرنامج إلى EXE
      run: |
        # 1. تجاوز تشفير PyArmor (النسخة المجانية تمنع العمل على GitHub Actions وتعطي out of license)
        New-Item -ItemType Directory -Force -Path obf_dist
        Copy-Item -Path "backend.py" -Destination "obf_dist\backend.py"
        # 2. نسخ مجلد الواجهة ومحتوياته إلى المجلد المشفر
        Copy-Item -Path "web" -Destination "obf_dist\web" -Recurse
        # 3. تشويش وضغط واجهة الويب (HTML/JS/CSS) لمنع سرقتها
        npm install -g html-minifier-terser
        html-minifier-terser --collapse-whitespace --remove-comments --minify-js true --minify-css true -o "obf_dist\web\index.html" "obf_dist\web\index.html"
        # 4. بناء البرنامج كـ (مجلد) وليس ملف واحد لتسريع الفتح بشكل مضاعف
        Set-Location obf_dist
        python -m eel backend.py web --onedir --noconsole --hidden-import eel --hidden-import requests --hidden-import concurrent.futures --hidden-import winsound --hidden-import tkinter --hidden-import subprocess --hidden-import shutil --hidden-import base64 --name "Tabaay_Student" --icon=web/icon.ico
        # 5. نقل مجلد البرنامج النهائي للمسار الأصلي ليتعرف عليه Inno Setup
        Set-Location ..
        New-Item -ItemType Directory -Force -Path dist
        Move-Item -Path "obf_dist\dist\Tabaay_Student" -Destination "dist\Tabaay_Student" -Force

    - name: تجميع ملف التنصيب (بواسطة Inno Setup)
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

    - name: تجهيز ملفات التحديث للرفع
      run: |
        # استخراج رقم الإصدار آلياً من ملف البايثون
        $content = Get-Content backend.py -Raw
        if ($content -match 'APP_VERSION\s*=\s*"([^"]+)"') {
            $version = $matches[1]
            # الرابط المباشر للبرنامج على سيرفرك
            $downloadLink = "https://app.altabaay.co/update_Student/Tabaay_Student_Setup.exe"
            $outContent = "$version`n$downloadLink"
            Set-Content -Path "Output\student_version.txt" -Value $outContent -Encoding UTF8
            Write-Host "تم بنجاح سحب الإصدار: $version"
        } else {
            Write-Error "لم يتم العثور على رقم الإصدار!"
            exit 1
        }

    - name: توليد ملف الهاش للصور
      run: |
        $assetsDir = "web\assets"
        $hashDict = @{}
        Get-ChildItem -Path $assetsDir -File -Recurse | ForEach-Object {
            $relativePath = $_.FullName.Substring((Resolve-Path $assetsDir).Path.Length + 1).Replace('\', '/')
            $hash = (Get-FileHash $_.FullName -Algorithm MD5).Hash.ToLower()
            $hashDict[$relativePath] = $hash
        }
        $hashDict | ConvertTo-Json -Depth 10 | Out-File -FilePath "$assetsDir\assets_hash.json" -Encoding UTF8

    - name: الرفع التلقائي للصور إلى سيرفر Bluehost عبر FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./web/assets/
        server-dir: /update_Student/assets/

    - name: الرفع التلقائي للبرنامج إلى سيرفر Bluehost عبر FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./Output/
        server-dir: /update_Student/

    - name: رفع ملف التنصيب الجاهز
      uses: actions/upload-artifact@v4
      with:
        name: Tabaay_Student_Installer
        path: Output/