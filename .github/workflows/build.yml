name: Build and Release Tabaay Student

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: سحب الكود من المستودع
      uses: actions/checkout@v4

    - name: إعداد بيئة بايثون
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: تثبيت المكتبات المطلوبة
      run: |
        python -m pip install --upgrade pip
        pip install eel requests pyinstaller

    - name: تحويل البرنامج إلى EXE (بواسطة PyInstaller و Eel)
      run: |
        python -m eel main.py web --onefile --noconsole --name "Tabaay_Student" --icon=web/icon.ico

    - name: تجميع ملف التنصيب (بواسطة Inno Setup)
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

    - name: رفع ملف التنصيب الجاهز
      uses: actions/upload-artifact@v4
      with:
        name: Tabaay_Student_Installer
        path: Output/Tabaay_Student_Setup.exe